- id: TEMP-007
  품명: 조립식가설울타리
  규격: EGI철판, H6.0
  단위: 식
  산출식:
    formula: 4 * SQRT(대지면적)
    inputs:
    - 대지면적
    description: 연장(m)=4*SQRT(대지면적), 형상보정계수 삭제됨
    logic: 대지둘레 추정
  수량:
    value: 1
    logic: 식이지만 비고에 L= m 표기
  비고: L= 자동계산

