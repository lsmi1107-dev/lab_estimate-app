- id: TEMP-003
  품명: 조립식가설사무소 / 도급자용
  규격: 3.0*6.0/3.0*9.0 혼합, 건축+기계 합산, 임대형 (3,000이하 100㎡=50+50, 6,000초과 200㎡=100+100) - 오늘 확정
  단위: 식
  산출식:
    formula: 'IF(연면적 <= 200, 12, IF(연면적 <= 1000, 48, IF(연면적 <= 3000, 100, IF(연면적 <= 6000, 120, 200))))'
    inputs:
      - 연면적
      - 대지면적
      - 건물용도
      - 구조
      - 지상층수
      - 공사기간
    description: '2020 표준품셈 2-1-2 건축·기계설비 품 합산 확정 - 200이하 12, 1,000이하 48(24+24), 3,000이하 100(50+50), 6,000이하 120(60+60), 6,000초과 200(100+100). 18,119㎡ 적용시 200㎡. 컨테이너 혼합배치 직접입력'
    logic: 'IF(연면적<=200,12,IF(<=1000,48,IF(<=3000,100,IF(<=6000,120,200)))) + 컨테이너 totalArea=count6*18+count9*27 + rentTotal=(count6*rent6+count9*rent9)*공사기간 + totalCost=rentTotal+installCost+transportCost'
    sub_formulas:
      requiredArea: 'IF(연면적 <= 200, 12, IF(연면적 <= 1000, 48, IF(연면적 <= 3000, 100, IF(연면적 <= 6000, 120, 200))))'
      count6: '직접입력 - 기본 3동 @3,000 (3*18=54) + 2동 @3,000초과 등'
      count9: '직접입력 - 기본 2동 @3,000 (2*27=54) = 합 108㎡ (100 요구 대비 +8)'
      totalArea: 'count6*18 + count9*27'
      monthlyRent: 'count6*rent6 + count9*rent9'
      rentTotal: 'monthlyRent * 공사기간'
      totalCost: 'rentTotal + installCost + transportCost + etcTotal'
  수량:
    value: 1
    logic: '식 고정, 내부 requiredArea 100㎡@3,000 / 200㎡@18,119, 계상면적 totalArea로 검증, 금액 totalCost'
  비고: '2020 표준품셈 2-1-2 건축+기계 합산 확정, 발주처 148.71 대비 51㎡ 과소 협의 필요'

