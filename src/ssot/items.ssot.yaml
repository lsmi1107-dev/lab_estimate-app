- id: TEMP-001
  품명: 조립식가설사무소/감리,감독자
  규격: 3.0*6.0/3.0*9.0 혼합, 건축+기계 합산, 임대형 (3,000이하 63㎡=38+25, 6,000초과 130㎡=80+50)
  단위: 식
  산출식:
    formula: 'IF(연면적 <= 200, 6, IF(연면적 <= 1000, 30, IF(연면적 <= 3000, 63, IF(연면적 <= 6000, 76, 130))))'
    inputs:
      - 연면적
      - 대지면적
      - 건물용도
      - 구조
      - 공사기간
    description: '2020 표준품셈 2-1-2 건축·기계설비 품 합산 확정 - 200이하 6, 1,000이하 30(12+18), 3,000이하 63(25+38), 6,000이하 76(30+46), 6,000초과 130(50+80). 컨테이너 3.0*6.0(18㎡)+3.0*9.0(27㎡) 혼합배치 직접입력, 임대료/설치해체/운반비 직접입력'
    logic: 'IF(연면적<=200,6,IF(<=1000,30,IF(<=3000,63,IF(<=6000,76,130)))) + 컨테이너 totalArea=count6*18+count9*27 + rentTotal=(count6*rent6+count9*rent9)*공사기간 + totalCost=rentTotal+installCost+transportCost+etcTotal'
    sub_formulas:
      requiredArea: 'IF(연면적 <= 200, 6, IF(연면적 <= 1000, 30, IF(연면적 <= 3000, 63, IF(연면적 <= 6000, 76, 130))))'
      count6: '직접입력 - 3.0x6.0 동수'
      count9: '직접입력 - 3.0x9.0 동수'
      totalArea: 'count6*18 + count9*27'
      monthlyRent: 'count6*rent6 + count9*rent9'
      rentTotal: 'monthlyRent * 공사기간'
      totalCost: 'rentTotal + installCost + transportCost + etcTotal'
  수량:
    value: 1
    logic: '식 고정, 내부 requiredArea 63㎡@3,000 / 130㎡@6,000초과, 계상면적 totalArea로 검증, 금액은 totalCost'
  비고: '감리/감독자용 - 2020 표준품셈 2-1-2 SKM_C251i26090415440.pdf 원표 건축+기계 합산, 3,000 이하 38+25=63, 발주처 132.48과 차이 2.48㎡ 거의 동일, 근거 PDF'

